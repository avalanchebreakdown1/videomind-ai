name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software-checks:
    name: Backend, frontend and browser integration
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      HF_HUB_OFFLINE: "1"
      VIDEOMIND_LOCAL_FILES_ONLY: "true"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.lock
          .venv/bin/python -m pip install --no-deps -e '.[dev]'
          .venv/bin/python -m pip check
      - name: Backend tests (no models or external services)
        run: env -u PYTHONPATH .venv/bin/python -m pytest
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Type check generated routes and application
        working-directory: frontend
        run: npm run typecheck
      - name: Install Chromium and system browser dependencies
        working-directory: frontend
        run: node_modules/node/bin/node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Browser integration (controlled offline ASR and writing)
        working-directory: frontend
        run: npm run test:e2e
      - name: Preserve browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
