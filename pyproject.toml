[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videomind-ai"
version = "0.4.0"
description = "Local, chunked audio transcription with preserved raw evidence"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1,<2", "yt-dlp>=2025.1", "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1", "python-multipart>=0.0.20",
    "python-docx>=1.1,<2",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
videomind = "videomind.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
markers = ["integration: requires local FFmpeg", "real_asr: requires downloaded Faster-Whisper model"]
addopts = "-m 'not real_asr'"
